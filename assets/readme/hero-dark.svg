<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280">
  <defs>
    <linearGradient id="monoTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <radialGradient id="monoAura" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Manrope', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Geist Mono', monospace; }
    .pulse-dot { animation: pulseDot 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .aura-anim { animation: ambientAura 6s ease-in-out infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
    @keyframes ambientAura { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse-dot, .aura-anim { animation: none; } }
  </style>

  <!-- Card Background -->
  <rect width="840" height="280" rx="20" fill="#08080A" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <rect width="840" height="280" rx="20" fill="url(#gridPattern)"/>

  <!-- Monochrome Ambient Spotlight -->
  <circle class="aura-anim" cx="420" cy="0" r="320" fill="url(#monoAura)"/>

  <!-- Top Status Badge -->
  <g transform="translate(48, 36)">
    <rect width="260" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#FFFFFF" class="pulse-dot"/>
    <text x="28" y="18" class="font-mono" font-size="10.5" font-weight="600" fill="#E4E4E7" letter-spacing="0.5">FOXEN 4.0.6 · FIREFOX EDITION</text>
  </g>

  <!-- Open Source Pill -->
  <g transform="translate(318, 36)">
    <rect width="116" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#E4E4E7" transform="translate(12, 6) scale(0.66)"/>
    <text x="32" y="18" class="font-mono" font-size="10.5" font-weight="600" fill="#E4E4E7">OPEN SOURCE</text>
  </g>

  <!-- 85 Functions Badge -->
  <g transform="translate(444, 36)">
    <rect width="112" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="14" y="18" class="font-mono" font-size="10.5" font-weight="600" fill="#E4E4E7">85 ФУНКЦИЙ</text>
  </g>

  <!-- Foxen Brand Logo and Title -->
  <g transform="translate(48, 86)">
    <rect width="64" height="64" rx="14" fill="#111115" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
    <image href="data:image/png;base64," x="6" y="6" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>

    <text x="82" y="44" class="font-sans" font-size="46" font-weight="700" fill="url(#monoTitleGrad)" letter-spacing="-0.5">FOXEN</text>
    <text x="84" y="64" class="font-sans" font-size="13.5" font-weight="500" fill="#A1A1AA">Полная экосистема инструментов, AI и автоматизации для продавцов FunPay</text>
  </g>

  <!-- Bottom Feature Chips Row -->
  <g transform="translate(48, 194)">
    <g transform="translate(0, 0)">
      <rect width="138" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M12 2L9.5 7.5 4 10l5.5 2.5L12 18l2.5-5.5L20 10l-5.5-2.5L12 2zm7 13l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15zm0-14l-1.25 2.75L15 5l2.75 1.25L19 9l1.25-2.75L23 5l-2.75-1.25L19 1z" fill="#FFFFFF" transform="translate(12, 10) scale(0.82)"/>
      <text x="38" y="25" class="font-sans" font-size="12.5" font-weight="600" fill="#E4E4E7">ИИ-ассистент</text>
    </g>
    <g transform="translate(148, 0)">
      <rect width="148" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.9 17.55 11 21 11 21z" fill="#FFFFFF" transform="translate(12, 10) scale(0.82)"/>
      <text x="36" y="25" class="font-sans" font-size="12.5" font-weight="600" fill="#E4E4E7">Авто-поднятие</text>
    </g>
    <g transform="translate(306, 0)">
      <rect width="144" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" fill="#FFFFFF" transform="translate(12, 10) scale(0.82)"/>
      <text x="38" y="25" class="font-sans" font-size="12.5" font-weight="600" fill="#E4E4E7">Авто-выдача</text>
    </g>
    <g transform="translate(460, 0)">
      <rect width="138" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M12 2a10 10 0 0 0-10 10c0 5.5 4.5 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.68-.27-1.3-.7-1.78-.44-.48-.7-1.12-.7-1.82 0-1.38 1.12-2.5 2.5-2.5H17a5 5 0 0 0 5-5c0-5.52-4.48-10-10-10zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="#FFFFFF" transform="translate(12, 10) scale(0.82)"/>
      <text x="38" y="25" class="font-sans" font-size="12.5" font-weight="600" fill="#E4E4E7">Live Styler</text>
    </g>
    <g transform="translate(608, 0)">
      <rect width="136" height="40" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z" fill="#FFFFFF" transform="translate(12, 10) scale(0.82)"/>
      <text x="38" y="25" class="font-sans" font-size="12.5" font-weight="600" fill="#E4E4E7">Мультичат</text>
    </g>
  </g>
</svg>