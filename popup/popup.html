<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>
<body>
    <div class="popup-wrapper">
        <header>
            <div class="header-logo">
                <img src="../icons/icon128.png" alt="Foxen" width="28" height="28">
                <div class="header-text">
                    <h1 class="brand-title">FOXEN</h1>
                    <span id="version-display"></span>
                </div>
            </div>
            <div id="status-dot" class="status-dot" title="Проверка статуса..."></div>
        </header>

        <main>
            <p class="instruction-text">
                Все настройки и инструменты находятся прямо на сайте <b>FunPay</b> в шапке сайта.
            </p>

            <div class="visual-guide">
                <img src="foxen-button-location.png" alt="Расположение кнопки Foxen">
            </div>

            <a id="goToFunPayBtn" class="cta-button" href="https://funpay.com" target="_blank">
                <span class="material-symbols-rounded">open_in_new</span>
                Открыть FunPay
            </a>
        </main>

        <div class="divider"></div>

        <section class="quick-stats" id="quickStats" style="display:none">
            <div class="stat-item">
                <span class="stat-label">Авто-ответы</span>
                <span class="stat-value" id="statAutoReply">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Авто-поднятие</span>
                <span class="stat-value" id="statAutoBump">-</span>
            </div>
        </section>

        <footer>
            <div class="quick-links">
                <a href="#" id="telegramBtn" title="Telegram-канал">
                    <span class="material-symbols-rounded">forum</span>
                    Канал
                </a>
                <a href="#" id="reviewBtn" title="Оставить отзыв">
                    <span class="material-symbols-rounded">rate_review</span>
                    Оценить
                </a>
                <a href="https://github.com/SanoSenpay/Foxen" id="changelogBtn" title="GitHub">
                    <span class="material-symbols-rounded">star</span>
                    GitHub
                </a>
            </div>
            <div class="credits">Fork by SanoSenpay · v<span id="footer-version"></span></div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
