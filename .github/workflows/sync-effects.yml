name: Sync Foxen Nickname Effects Registry

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-effects, update-banner]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync effects & public profiles script
        run: node scripts/sync_effects.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage newly generated snapshots in temporary location
          cp effects.json /tmp/effects.json
          cp public_profiles.json /tmp/public_profiles.json
          
          # Switch to orphan data branch
          git checkout --orphan data
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/effects.json effects.json
          cp /tmp/public_profiles.json public_profiles.json
          git add effects.json public_profiles.json
          
          # Commit and push snapshot to data branch
          git commit -m "Auto-sync effects & public profiles [skip ci]" || echo "No changes to commit"
          git push -f origin data
