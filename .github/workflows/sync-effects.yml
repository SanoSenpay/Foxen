name: Sync Foxen Nickname Effects Registry

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-effects]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync effects script
        run: node scripts/sync_effects.js

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ! git diff --quiet effects.json; then
            echo "Changes detected in effects registry. Pushing single snapshot to data branch..."
            cp effects.json /tmp/effects.json
            git checkout --orphan data
            git rm -rf . > /dev/null 2>&1 || true
            cp /tmp/effects.json effects.json
            git add effects.json
            git commit -m "Auto-sync effects registry [skip ci]"
            git push -f origin data
          else
            echo "No changes in effects registry."
          fi
